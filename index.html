<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>maria turns 30</title>
<meta name="description" content="maria turns 30 — beautifully bizarre. sat, dec 05 · 19:00 · NOMER">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --red: #e8191c;
    --ink: #000;
    --bg: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body {
    display: grid;
    place-items: center;
    touch-action: none;
    cursor: default;
  }
  .ball {
    position: relative;
    width: min(88vw, 88vh, 640px);
    aspect-ratio: 1;
    will-change: transform;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--red);
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="ball" id="ball">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="sr-only">
      <h1>maria turns 30</h1>
      <p>theme of the night: beautifully bizarre</p>
      <p>sat, dec 05 · 19:00</p>
      <p>NOMER</p>
    </div>
  </main>

<script>
(() => {
  const RED = [232 / 255, 25 / 255, 28 / 255];
  const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

  // --- Text texture -------------------------------------------------------
  // The invitation is drawn flat onto a square canvas, then sampled by the lens shader.
  const TEX = 1024;
  const tex = document.createElement('canvas');
  tex.width = tex.height = TEX;
  const t = tex.getContext('2d');

  function drawTexture() {
    t.fillStyle = `rgb(${RED.map(c => c * 255).join(',')})`;
    t.fillRect(0, 0, TEX, TEX);
    t.fillStyle = '#000';
    t.textAlign = 'center';
    t.textBaseline = 'middle';
    const cx = TEX / 2;
    const line = (txt, size, weight, y, spacing = 0) => {
      t.font = `${weight} ${size}px ${FONT}`;
      if ('letterSpacing' in t) t.letterSpacing = spacing + 'px';
      t.fillText(txt, cx, y);
    };
    line('maria turns 30', 118, 700, 270, -3);
    line('THEME OF THE NIGHT', 40, 400, 410, 4);
    line('beautifully bizarre', 92, 700, 490, -2);
    line('sat, dec 05 · 19:00', 64, 400, 640);
    line('NOMER', 88, 700, 750, 1);
  }

  // --- WebGL --------------------------------------------------------------
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: true, premultipliedAlpha: false });
  if (!gl) { fallback(); return; }

  const vs = `
    attribute vec2 p;
    varying vec2 uv;
    void main() { uv = p; gl_Position = vec4(p, 0.0, 1.0); }
  `;
  // Text sealed inside a mirrored glass ball:
  //  - the core shows the invitation flat, slightly magnified like through glass;
  //  - toward the rim the inside surface reflects it: polar-mapped, mirrored,
  //    wrapped around the circumference and smeared along it.
  const fs = `
    precision highp float;
    varying vec2 uv;
    uniform sampler2D tex;
    uniform vec2 off;     // parallax of the inner text
    uniform float phi;    // rotation of the reflections around the rim
    uniform vec2 blur;    // motion smear of the inner text
    uniform float spread; // angular smear of the reflections
    uniform vec3 red;

    const float S = 0.6;  // texture units per ball radius

    float ink(vec2 p) {
      vec4 c = texture2D(tex, vec2(0.5 + p.x * S, 0.5 - p.y * S));
      return clamp(1.0 - c.r / red.r, 0.0, 1.0);
    }

    void main() {
      vec2 q = uv;
      float r = length(q);
      if (r > 1.0) { gl_FragColor = vec4(red, 0.0); return; }

      // Inner text: gentle fisheye, magnified in the middle.
      vec2 m = q * (0.84 + 0.32 * r * r) + off;
      float a = 0.0;
      for (int i = 0; i < 5; i++) {
        float k = float(i) / 4.0 - 0.5;
        a += ink(m + blur * k);
      }
      a /= 5.0;
      float wm = 1.0 - smoothstep(0.66, 0.84, r);

      // Reflection: the closer to the rim, the deeper into the text it looks,
      // so the same lines curl around the edge, mirrored.
      float t = clamp((r - 0.66) / 0.34, 0.0, 1.0);
      float rr = mix(0.5, 0.16, t);
      float ang = atan(q.y, q.x) + phi;
      float b = 0.0;
      for (int j = 0; j < 7; j++) {
        float aj = ang + (float(j) / 6.0 - 0.5) * spread;
        vec2 d = vec2(-cos(aj), sin(aj)) * rr - off * 1.6;
        b += ink(d);
      }
      b /= 7.0;
      float wr = smoothstep(0.66, 0.86, r) * 0.88;

      float v = max(a * wm, b * wr);
      vec3 col = mix(red, vec3(0.0), v);
      col *= 1.0 - 0.14 * smoothstep(0.82, 1.0, r); // darker glass edge
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const texture = gl.createTexture();
  function uploadTexture() {
    drawTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  }
  uploadTexture();
  if (document.fonts) document.fonts.ready.then(uploadTexture);

  const U = {
    off: gl.getUniformLocation(prog, 'off'),
    phi: gl.getUniformLocation(prog, 'phi'),
    blur: gl.getUniformLocation(prog, 'blur'),
    spread: gl.getUniformLocation(prog, 'spread'),
    red: gl.getUniformLocation(prog, 'red'),
  };
  gl.uniform3fv(U.red, RED);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr);
    if (canvas.width !== w) {
      canvas.width = canvas.height = w;
      gl.viewport(0, 0, w, w);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Input --------------------------------------------------------------
  // Pointer position normalised to [-1, 1] relative to the viewport centre.
  const target = { x: 0, y: 0 };
  let lastInput = -Infinity;

  function setPointer(clientX, clientY) {
    target.x = (clientX / window.innerWidth) * 2 - 1;
    target.y = (clientY / window.innerHeight) * 2 - 1;
    lastInput = performance.now();
  }
  window.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    const p = e.touches[0];
    if (p) setPointer(p.clientX, p.clientY);
  }, { passive: true });

  // Phone tilt also steers the ball (iOS asks for permission on first tap).
  function onTilt(e) {
    if (e.gamma == null) return;
    target.x = Math.max(-1, Math.min(1, e.gamma / 35));
    target.y = Math.max(-1, Math.min(1, (e.beta - 40) / 35));
    lastInput = performance.now();
  }
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    window.addEventListener('pointerup', function ask() {
      DOE.requestPermission().then(s => {
        if (s === 'granted') window.addEventListener('deviceorientation', onTilt);
      }).catch(() => {});
      window.removeEventListener('pointerup', ask);
    });
  } else if (DOE) {
    window.addEventListener('deviceorientation', onTilt);
  }

  // --- Animation ----------------------------------------------------------
  const ball = document.getElementById('ball');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Two chained exponential smoothers: no overshoot, no jitter.
  const s = { ax: 0, ay: 0, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0 };
  let prev = performance.now();

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    // Without input for a while the ball idles in a lazy figure-eight.
    let tx = target.x, ty = target.y;
    if (now - lastInput > 2500 && !reduce) {
      const k = now / 1000;
      tx = Math.sin(k * 0.7) * 0.55;
      ty = Math.sin(k * 1.1) * 0.35;
    }

    const k = 1 - Math.exp(-dt * (reduce ? 1.5 : 2.6));
    s.ax += (tx - s.ax) * k;
    s.ay += (ty - s.ay) * k;
    s.x += (s.ax - s.x) * k;
    s.y += (s.ay - s.y) * k;

    // Per-frame velocity, itself smoothed so blur and tilt don't flicker.
    const kv = 1 - Math.exp(-dt * 6);
    // Speed in units per second, so the look doesn't depend on frame rate.
    s.vx += ((s.x - s.px) / Math.max(dt, 1e-3) - s.vx) * kv;
    s.vy += ((s.y - s.py) / Math.max(dt, 1e-3) - s.vy) * kv;
    s.px = s.x; s.py = s.y;
    const vx = s.vx, vy = s.vy;


    // The disc itself drifts toward the pointer and tilts slightly with speed.
    const travel = Math.min(window.innerWidth, window.innerHeight) * 0.06;
    ball.style.transform =
      `translate(${s.x * travel}px, ${s.y * travel}px)`;

    gl.uniform2f(U.off, -s.x * 0.12, s.y * 0.1);
    gl.uniform1f(U.phi, s.x * 0.9 + s.y * 0.45);
    const speed = Math.hypot(vx, vy);
    gl.uniform1f(U.spread, reduce ? 0.04 : Math.min(0.06 + speed * 0.12, 0.35));
    // Cap the smear so fast jumps stay readable.
    let bx = -vx * 0.06, by = vy * 0.06;
    const bl = Math.hypot(bx, by), maxBlur = 0.03;
    if (bl > maxBlur) { bx *= maxBlur / bl; by *= maxBlur / bl; }
    gl.uniform2f(U.blur, reduce ? 0 : bx, reduce ? 0 : by);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Static version if WebGL is unavailable.
  function fallback() {
    drawTexture();
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.height = TEX;
    ctx.drawImage(tex, 0, 0);
  }
})();
</script>
</body>
</html>
